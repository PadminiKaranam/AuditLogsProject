spring.datasource.url=jdbc:h2:mem:auditdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
logging.level.com.persistent.audit=WARN
audit.jwt.secret=audit-log-service-hs256-secret-key-32
audit.jwt.expiration-ms=3600000
audit.jwt.issuer=audit-log-service
audit.jwt.audience=audit-api
audit.jwt.require-jti=true
audit.http.max-request-size-bytes=1048576
audit.payload.max-chars=8192
audit.login.rate-limit.max-failed-attempts=5
audit.login.rate-limit.window-ms=900000
spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
audit.cors.allowed-origins=http://localhost:8080,http://localhost:8081,http://localhost:8082
audit.cors.allowed-methods=GET,PUT,POST
audit.cors.allowed-headers=Authorization
audit.cors.exposed-headers=Content-Disposition
audit.cors.allow-credentials=false
audit.cors.max-age=3600
