spring.datasource.url=jdbc:h2:mem:auditdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
logging.level.com.persistent.audit=WARN
audit.jwt.secret=audit-log-service-hs256-secret-key-32
audit.jwt.expiration-ms=3600000
