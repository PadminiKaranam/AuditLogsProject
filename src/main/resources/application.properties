spring.application.name=audit
server.port=8081

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/auditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (HS256 secret must be at least 32 bytes)
audit.jwt.secret=audit-log-service-hs256-secret-key-32
audit.jwt.expiration-ms=3600000

# Logging (INFO for default/prod). Activate dev with --spring.profiles.active=dev
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=./logs/audit-events.log
logging.level.root=INFO
logging.level.com.persistent.audit=INFO
