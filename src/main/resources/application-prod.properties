# Production profile: secrets, TLS, and schema come from the environment.
# Activate with: --spring.profiles.active=prod

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.url=${AUDIT_DB_URL:jdbc:h2:file:./data/auditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${AUDIT_DB_USERNAME}
spring.datasource.password=${AUDIT_DB_PASSWORD}

audit.jwt.secret=${AUDIT_JWT_SECRET}
audit.jwt.expiration-ms=${AUDIT_JWT_EXPIRATION_MS:3600000}
audit.jwt.issuer=${AUDIT_JWT_ISSUER:audit-log-service}
audit.jwt.audience=${AUDIT_JWT_AUDIENCE:audit-api}
audit.jwt.require-jti=true

audit.cors.allowed-origins=${AUDIT_CORS_ALLOWED_ORIGINS}
audit.cors.allow-credentials=false

server.ssl.enabled=${AUDIT_TLS_ENABLED:true}
server.ssl.key-store=${AUDIT_TLS_KEYSTORE}
server.ssl.key-store-password=${AUDIT_TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=${AUDIT_TLS_KEYSTORE_TYPE:PKCS12}

logging.level.root=WARN
logging.level.com.persistent.audit=INFO
